name: ones1ght_sdk
description: "OneS1ght indoor positioning SDK for Flutter. Wraps the OneS1ght iOS and Android SDKs: UWB positioning, zone enter / exit / dwell events and upload."
version: 0.0.3
homepage: https://docs.ones1ght.com/en/sdk/integration/flutter
repository: https://github.com/onecheck-inc/OneS1ght-Flutter-SDK
issue_tracker: https://github.com/onecheck-inc/OneS1ght-Flutter-SDK/issues
topics:
  - indoor-positioning
  - uwb
  - location
  - geofencing

environment:
  sdk: ^3.8.0
  # iOS 는 Swift Package Manager 로만 붙는다 — Flutter 3.44 부터 기본으로 켜진다.
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: co.onecheck.ones1ght.flutter
        pluginClass: Ones1ghtPlugin
      ios:
        pluginClass: Ones1ghtPlugin
